name: ubuntu-static-reports
type: charm
title: Ubuntu Static Reports charm
summary: Generate Static reports for Ubuntu
description: |
  **Ubuntu Static Reports Operator** is a [charm](https://juju.is/charms-architecture)
  for building and presenting various static reports for Ubuntu. Fetching those
  live from launchpad API or similar sources every time would be too stressful
  and therefore are done on a regular schedule with the reports then being made
  available on the web.

links:
  website:
    - https://charmhub.io/ubuntu-static-reports
  issues:
    - https://github.com/canonical/ubuntu-static-reports-operator/issues
  source:
    - https://github.com/canonical/ubuntu-static-reports-operator

base: ubuntu@24.04
platforms:
  amd64:

parts:
  ubuntu-static-reports-charm:
    source: .
    plugin: uv
    build-packages: [git]
    build-snaps: [astral-uv]
    override-build: |
      craftctl default  # Run the default build steps.
      git describe --always > $CRAFT_PART_INSTALL/version
      chmod +x "$CRAFT_PART_INSTALL"/src/script/*

storage:
  # Some data sets e.g. germinate can be quite large
  staticreports:
    description: data sets of the static reports
    type: filesystem
    location: /srv/staticreports/
    # 0-1: allow detaching/removing the instance so it can be re-provisioned
    # from a different pool (e.g. rootfs -> cinder-nvme) without redeploying
    # the app - or also vice versa re-deploying the app but detach/attach
    # the storage so data can persist over to the new instance.
    multiple:
      range: 0-1

charm-libs:
  - lib: operator_libs_linux.systemd
    version: "1"
  - lib: traefik_k8s.ingress
    version: "2"

actions:
  refresh:
    description: |
      Force refreshing the content of the static reports.

requires:
  ingress:
    interface: ingress
    limit: 1
    optional: true

config:
  options:
    lpuser_secret_id:
      description: |
        The secret ID for a vault containing the Launchpad oauth token
        under ky lpoauthkey, to be used for services that need
        authenticated users.
      type: secret
    rsync_archive_source:
      description: |
        rsync source for the Ubuntu archive indices (the dists tree), used by
        update-archive-mirror to keep the local snapshot current. Defaults to
        the public Ubuntu archive mirror; set to the internal ftp-master mirror
        (ftpmaster.internal::ubuntu-dists/) on units that can reach it directly.
      type: string
      default: "rsync://rsync.archive.ubuntu.com/ubuntu/dists/"
    mirror_dir:
      description: |
        Directory where update-archive-mirror and update-germinate publish
        their snapshots: <mirror_dir>/archive/ holds the archive-index
        snapshots, <mirror_dir>/germinate/ the combined archive+germinate
        ones, each with a `current` symlink atomically updated to the latest
        snapshot. Kept on one filesystem so update-germinate can cheaply
        hardlink the archive indices. By default this maps to the storage
        named staticreports.
      type: string
      default: "/srv/staticreports"
