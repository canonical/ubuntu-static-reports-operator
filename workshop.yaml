name: staging
base: ubuntu@26.04
runtime: lxd-vm
sdks:
  - name: uv
  - name: project-staging
  - name: system
    slots:
      lp-oauth:
        interface: secret
        attributes:
          service: launchpad
          account: lp-ubuntu-archive-unprivileged-bot
connections:
  - plug: staging:lp-oauth
    slot: system:lp-oauth
actions:
  lint: make lint
  format: make format
  unit: make unit
  build: sg lxd -c "charmcraft pack --use-lxd $*"
  deploy: bash /project/.workshop/staging/manage deploy "$@"
  redeploy: bash /project/.workshop/staging/manage redeploy "$@"
  status: bash /project/.workshop/staging/manage status "$@"
  logs: bash /project/.workshop/staging/manage logs "$@"
  services: bash /project/.workshop/staging/manage services "$@"
  ssh: bash /project/.workshop/staging/manage ssh "$@"
  destroy: bash /project/.workshop/staging/manage destroy "$@"
